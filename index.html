<html lang="ko">

<meta charset="utf-8">

<title>영암읍 청년 인프라 지도</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f6f5f1;--panel:#ffffff;--ink:#1d2320;--sub:#66706a;--line:#dedcd3;--accent:#1f6f54;
--c-food:#d9531e;--c-med:#1f8a5b;--c-cul:#2b6cb0;--c-life:#5b7a84;--c-stay:#7b4fa0;--c-pub:#3a3f44;
--font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--panel:#1c211e;--ink:#eceee9;--sub:#9aa39d;--line:#2d3430;--accent:#4fc08f;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px}
#app{display:grid;grid-template-columns:380px 1fr;height:100%}
#side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
header{padding:16px 16px 10px}
h1{font-size:18px;margin:0 0 2px;font-weight:700}
.sub{color:var(--sub);font-size:12px}
.tools{padding:0 16px 10px;display:flex;flex-direction:column;gap:8px}
input[type=search]{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);padding:5px 10px;border-radius:99px;font:inherit;font-size:12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.chip[aria-pressed=false]{opacity:.4}
.chip:focus-visible,button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#status{padding:8px 16px;font-size:12px;color:var(--sub);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
#list{overflow:auto;flex:1;min-height:0}
.row{display:grid;grid-template-columns:10px 1fr;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover,.row.sel{background:var(--bg)}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px}
.nm{font-weight:500}.nm small{color:var(--sub);font-weight:400;margin-left:6px}
.mn{color:var(--sub);font-size:12px;margin-top:2px}
.pend{font-size:11px;color:var(--sub)}
#mapwrap{position:relative;min-height:0}
#map{position:absolute;inset:0}
#detail{position:absolute;left:12px;bottom:12px;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;z-index:10;box-shadow:0 4px 16px rgba(0,0,0,.18)}
#detail h2{margin:0 0 4px;font-size:16px}
#detail dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
#detail dt{color:var(--sub)}#detail dd{margin:0;overflow-wrap:anywhere}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--sub);margin-left:6px}
.x{position:absolute;right:8px;top:6px;border:0;background:none;color:var(--sub);font-size:18px;cursor:pointer}
button.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:5px 9px;font:inherit;font-size:12px;cursor:pointer}
#banner{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-size:12px;max-width:90%}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pin b{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700}
@media (max-width:760px){
 #app{grid-template-columns:1fr;grid-template-rows:55% 45%}
 #mapwrap{order:-1}#side{border-right:0;border-top:1px solid var(--line)}
 #detail{right:12px;max-width:none}
}
</style>
</head>

 <aside id="side">

["L","편의점(안전상비의약품 판매)","씨유 영암로드점","편의점","예향로 1691","061-471-0408","","",9],
["L","편의점(안전상비의약품 판매)","GS25 영암중앙점","편의점","남문로 1","061-473-2610","","",9],
["C","작은영화관","기찬시네마","2개 상영관 93석(1관 58석·2관 35석), 2D·3D 상영","(도로명 확인 필요)","","","영암읍 소재(2022-12 개관). 도로명주소·전화·상영시간 확인 필요",10],
["C","문화시설","영암문화원","도서관·전시실·공연장·관광센터, 문화학교(풍물·서예·노래교실 등)","교동로 55","061-473-2632","평일 08:30~17:30 / 토·일·공휴일 휴무","",11],
["C","박물관","영암곤충박물관","곤충 전시·체험","기찬랜드로 41","061-461-4300","월요일 휴관","입장료 28개월 이상 8,000원(출처 기준) — 변동 가능",12],
["C","공원·물놀이장","월출산 기찬랜드","여름철 물놀이장","기찬랜드로 19-3","","여름철 한정 운영","주소는 출처 목록 기준. 공중화장실 데이터상 기찬랜드로 19-10 — 확인 필요",12],
["C","기타문화시설","가야금산조기념관","가야금산조 기념·전시","기찬랜드로 19-10","","","주소는 공중화장실 목록(devcomma) 기준 — 확인 필요",13],
["C","체육시설","영암종합스포츠타운","보조경기장, 야구장 등","여운재로 21","","","지번 역리 135-1",14],
["S","한옥 독채 숙소","기찬빌리지","한옥 객실 6, 잔디광장·수영장, 음식점·카페·노래방 등 부대시설","기찬랜드로 41","1899-3066","체크인 15:00 / 체크아웃 11:00","예약: 네이버예약",15],
["P","군청","영암군청","","군청로 1","061-470-2114","","",16]
];
const DATA=R.map(function(r,i){return {id:i+1,cat:CATS[r[0]],kind:r[1],name:r[2],menu:r[3],road:r[4],addr:BASE+r[4],tel:r[5],hours:r[6],note:r[7],src:SRC[r[8]][0],grade:SRC[r[8]][1]};});
const COLORS={"먹거리":"--c-food","의료":"--c-med","문화·여가":"--c-cul","생활편의":"--c-life","숙박":"--c-stay","공공기관":"--c-pub"};
const cv=function(n){return getComputedStyle(document.documentElement).getPropertyValue(COLORS[n]).trim()||"#555"};
const CK="yeongam_coords_v1";
let cache={};try{cache=JSON.parse(localStorage.getItem(CK)||"{}")}catch(e){}
const save=function(){try{localStorage.setItem(CK,JSON.stringify(cache))}catch(e){}};
const state={on:new Set(Object.keys(COLORS)),q:"",sel:null};
const $=function(id){return document.getElementById(id)};
const cats=Array.from(new Set(DATA.map(function(d){return d.cat})));
$("total").textContent=DATA.length;
function cleanAddr(a){return a.replace("전남광주통합특별시","전라남도").replace(/\s*\(.*?\)/g,"").replace(/\s+\d+층.*$/,"").replace(/\s+지하.*$/,"").trim()}
const esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
let M;
function initKakao(){
  const kakao=window.kakao,map=new kakao.maps.Map($("map"),{center:new kakao.maps.LatLng(CENTER[0],CENTER[1]),level:5});
  const gc=new kakao.maps.services.Geocoder(),ps=new kakao.maps.services.Places();
  const mk={};
  const addr=function(a){return new Promise(function(r){gc.addressSearch(a,function(res,s){r(s==="OK"&&res[0]?{lat:+res[0].y,lng:+res[0].x}:null)})})};
  const kw=function(q){return new Promise(function(r){ps.keywordSearch(q,function(res,s){r(s==="OK"&&res[0]?{lat:+res[0].y,lng:+res[0].x}:null)},{location:new kakao.maps.LatLng(CENTER[0],CENTER[1]),radius:4000})})};
  M={
    mark:function(d,pos){const el=document.createElement("div");el.innerHTML='<div class="pin" style="background:'+cv(d.cat)+'"><b>'+d.cat[0]+'</b></div>';const p=el.firstChild;p.onclick=function(){select(d.id,true)};
      const o=new kakao.maps.CustomOverlay({position:new kakao.maps.LatLng(pos.lat,pos.lng),content:p,yAnchor:1.1,map:map});mk[d.id]={o:o,pos:pos}},
    show:function(d,v){const m=mk[d.id];if(m)m.o.setMap(v?map:null)},
    focus:function(d){const m=mk[d.id];if(m){map.setLevel(3);map.panTo(new kakao.maps.LatLng(m.pos.lat,m.pos.lng))}},
    fit:function(){const b=new kakao.maps.LatLngBounds();let n=0;Object.values(mk).forEach(function(m){b.extend(new kakao.maps.LatLng(m.pos.lat,m.pos.lng));n++});if(n)map.setBounds(b)},
    geocode:async function(d){
      if(d.road[0]==="(")return await kw("영암 "+d.name);
      return (await addr(cleanAddr(d.addr)))||(await addr(cleanAddr(d.addr).replace(/\s+\d+(-\d+)?$/,"")))||(await kw("영암 "+d.name));
    }
  };
}
function loadScript(src){return new Promise(function(ok,no){const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)})}
function match(d){
  if(!state.on.has(d.cat))return false;
  const q=state.q.trim().toLowerCase();if(!q)return true;
  return [d.name,d.menu,d.kind,d.cat].join(" ").toLowerCase().indexOf(q)>=0;
}
function renderChips(){
  $("chips").innerHTML=cats.map(function(c){return '<button class="chip" data-c="'+c+'" aria-pressed="'+state.on.has(c)+'"><i style="background:'+cv(c)+'"></i>'+c+' '+DATA.filter(function(d){return d.cat===c}).length+'</button>'}).join("");
  $("chips").querySelectorAll(".chip").forEach(function(b){b.onclick=function(){const c=b.dataset.c;state.on.has(c)?state.on.delete(c):state.on.add(c);refresh()}});
}
function renderList(){
  const rows=DATA.filter(match);
  $("list").innerHTML=rows.map(function(d){return '<div class="row'+(state.sel===d.id?" sel":"")+'" tabindex="0" data-id="'+d.id+'"><span class="dot" style="background:'+cv(d.cat)+'"></span><div><div class="nm">'+esc(d.name)+'<small>'+esc(d.kind)+'</small></div><div class="mn">'+esc(d.menu||"")+'</div>'+((cache[d.id]&&cache[d.id].ok)?"":'<div class="pend">위치 확인 중/미확인</div>')+'</div></div>'}).join("")||'<div class="row"><div class="mn">검색 결과가 없습니다.</div></div>';
  $("list").querySelectorAll(".row[data-id]").forEach(function(r){r.onclick=function(){select(+r.dataset.id,true)};r.onkeydown=function(e){if(e.key==="Enter")select(+r.dataset.id,true)}});
}
function refresh(){renderChips();renderList();if(M)DATA.forEach(function(d){M.show(d,match(d))})}
function select(id,focus){
  state.sel=id;const d=DATA.find(function(x){return x.id===id});renderList();
  const fields=[["주소",d.addr],["전화",d.tel],["영업",d.hours],["출처",d.src],["확인",d.grade],["비고",d.note]].filter(function(f){return f[1]});
  $("detail").hidden=false;
  $("detail").innerHTML='<button class="x" aria-label="닫기" onclick="document.getElementById(\'detail\').hidden=true">×</button><h2>'+esc(d.name)+'<span class="badge" style="color:'+cv(d.cat)+'">'+d.cat+' · '+esc(d.kind)+'</span></h2>'+(d.menu?'<div>'+esc(d.menu)+'</div>':'')+'<dl>'+fields.map(function(f){return '<dt>'+f[0]+'</dt><dd>'+esc(f[1])+'</dd>'}).join("")+'</dl>';
  if(focus&&M)M.focus(d);
}
$("q").oninput=function(e){state.q=e.target.value;refresh()};
$("exp").onclick=async function(){
  const t="번호,상호,위도,경도\n"+DATA.filter(function(d){return cache[d.id]&&cache[d.id].ok}).map(function(d){return d.id+","+d.name+","+cache[d.id].lat+","+cache[d.id].lng}).join("\n");
  try{await navigator.clipboard.writeText(t);$("exp").textContent="복사됨"}catch(e){$("stat").textContent="복사 실패: 콘솔에서 확인";console.log(t)}
  setTimeout(function(){$("exp").textContent="좌표 복사(CSV)"},1500);
};
async function start(){
  renderChips();renderList();
  try{
    await loadScript("https://dapi.kakao.com/v2/maps/sdk.js?appkey="+KAKAO_JS_KEY+"&libraries=services&autoload=false");
    await new Promise(function(r){kakao.maps.load(r)});initKakao();
  }catch(e){$("banner").hidden=false;$("banner").textContent="지도를 불러오지 못했습니다. 카카오 키와 도메인 등록을 확인하세요.";return}
  let done=0,fail=0;
  const upd=function(){$("stat").textContent="핀 "+done+"곳 표시 · 미확인 "+fail+"곳 / 전체 "+DATA.length+"곳"};
  for(const d of DATA){
    let pos=cache[d.id];
    if(!(pos&&pos.ok)){try{pos=await M.geocode(d)}catch(e){pos=null}if(pos){pos.ok=1;cache[d.id]=pos;save()}}
    if(pos&&pos.ok){M.mark(d,pos);M.show(d,match(d));done++}else fail++;
    upd();
  }
  M.fit();renderList();
}
start();
</script>
</body>
